<!DOCTYPE html>
<!--
  templates/base_auth.html
  ──────────────────────────────────────────────────────────────────────────────
  PURPOSE:
    Standalone layout for unauthenticated pages (login screen).
    Does NOT include the sidebar or navigation — just a clean centered layout.
    
    base.html      = Authenticated pages (sidebar + top bar + content)
    base_auth.html = Unauthenticated pages (centered card layout)
  ──────────────────────────────────────────────────────────────────────────────
-->
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% block title %}Sign In{% endblock %} — CreditIQ</title>
  <meta name="description" content="{% block meta_description %}Admin login for CreditIQ{% endblock %}" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
              300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
              600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81',
            },
            surface: {
              900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569',
            },
          },
          animation: {
            'fade-in':  'fadeIn 0.3s ease-in-out',
            'slide-in': 'slideIn 0.3s ease-out',
          },
          keyframes: {
            fadeIn:  { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideIn: { '0%': { transform: 'translateY(-8px)', opacity: '0' },
                       '100%': { transform: 'translateY(0)', opacity: '1' } },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="{% static 'css/custom.css' %}" />
</head>

<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">
  <main class="animate-fade-in">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
